version: 2

models:
  - name: dim_customer
    description: "Customer dimension"
    columns:
      - name: customer_id
        description: "Unique customer identifier"
        tests:
          - unique
          - not_null

  - name: dim_account
    description: "Account dimension"
    columns:
      - name: account_id
        tests:
          - unique
          - not_null

  - name: fact_transactions
    description: "One row per transaction"
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: amount
        tests:
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['success', 'failed', 'pending']
      - name: account_id
        tests:
          - relationships:
              to: ref('dim_account')
              field: account_id
