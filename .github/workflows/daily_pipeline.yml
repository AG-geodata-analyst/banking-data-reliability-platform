name: Daily Banking Pipelines

on:
  schedule:
    # 04:00 UTC daily — off-peak minute
    - cron: '0 4 * * *'
  workflow_dispatch:   # allow manual runs

permissions:
  contents: write      # required to commit snapshots back

jobs:
  run-pipelines:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: airflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AIRFLOW_HOME: ${{ github.workspace }}/airflow_home
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////tmp/airflow.db
      PYTHONPATH: ${{ github.workspace }}
      FDIC_API_KEY: ${{ secrets.FDIC_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "apache-airflow==3.1.3" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.1.3/constraints-3.12.txt"
          pip install requests pandas pydantic psycopg2-binary \
                      apache-airflow-providers-postgres \
                      Faker dbt-core dbt-postgres

      - name: Apply database schemas
        env:
          PGPASSWORD: airflow
        run: |
          psql -h localhost -U airflow -d airflow -f sql/schema.sql
          psql -h localhost -U airflow -d airflow -f sql/quarantine.sql
          psql -h localhost -U airflow -d airflow -f sql/ops.sql

      - name: Initialize Airflow
        run: |
          mkdir -p $AIRFLOW_HOME
          airflow db migrate

      - name: Register Postgres connection
        run: |
          airflow connections add postgres_banking \
            --conn-type postgres --conn-host localhost \
            --conn-schema airflow --conn-login airflow \
            --conn-password airflow --conn-port 5432

      - name: Run synthetic pipeline
        run: airflow dags test banking_daily_etl $(date -u +%Y-%m-%d)

      - name: Run FDIC pipeline
        run: airflow dags test fdic_daily_etl $(date -u +%Y-%m-%d)

      - name: Commit dashboard snapshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update dashboard snapshots ($(date -u +%F))"
            git push
          fi
